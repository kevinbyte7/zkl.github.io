<!DOCTYPE html>
<html data-page-node-id="nrIvVEhI4DxqG55JWwtYXM" lang="zh-CN">
<head data-page-node-id="znStQDMvFAFkXpmI1rtyLK">

<title data-page-node-id="mYF2BSYmVgpz3SUFmsiggw" data-pnid-children="lXyyGrCJxAFiYkYh5o0sSS">中民康悦 · 微信小程序原型</title>
<style data-page-node-id="QAMZIPhCuzMhBHPL6HKZtT" data-pnid-children="NG47azNQte795Q0lXRbygz">
:root{
  --red:#E8710A; --red-dark:#C25A05; --red-soft:#FFF1E4; --gold:#E9A23B;
  --paper:#F7F5F0; --card:#FFFFFF; --ink:#252525; --ink2:#5C574F;
  --line:#EAE4D9; --green:#2F8A5B; --blue:#2A6FB0;
  --shell:#1D1E21; --panel:#26282C; --panel2:#2E3136; --stroke:#3B3F45;
  --shelltxt:#E6E6E6; --shellmuted:#9EA3AA;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--shell);color:var(--shelltxt);overflow:hidden}

/* ===== Axure 风格外壳 ===== */
.topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--stroke);display:flex;align-items:center;padding:0 16px;gap:14px;flex-shrink:0}
.topbar .brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:.3px}
.topbar .brand .mark{width:24px;height:24px;border-radius:6px;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff}
.topbar .divider{width:1px;height:22px;background:var(--stroke)}
.topbar .crumb{font-size:12px;color:var(--shellmuted);flex:1}
.topbar .crumb b{color:#fff;font-weight:600}
.tool{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--stroke);color:var(--shelltxt);border-radius:6px;padding:6px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.tool:hover{background:#3A3E44}
.tool.on{background:var(--red);border-color:var(--red);color:#fff}
.zoom{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--shellmuted)}
.zoom button{width:24px;height:24px;border-radius:5px;border:1px solid var(--stroke);background:var(--panel2);color:var(--shelltxt);cursor:pointer;font-size:14px}

.workspace{display:flex;height:calc(100vh - 52px)}
.side{width:236px;background:var(--panel);border-right:1px solid var(--stroke);overflow-y:auto;flex-shrink:0}
.side h3{font-size:11px;letter-spacing:1.5px;color:var(--shellmuted);padding:18px 16px 8px;font-weight:600}
.tree-group{padding:0 8px 8px}
.tree-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:6px;font-size:13px;color:#CFD2D6;cursor:pointer;line-height:1.3}
.tree-item:hover{background:var(--panel2)}
.tree-item.active{background:var(--red);color:#fff}
.tree-item .idx{font-size:10px;opacity:.65;min-width:16px;font-variant-numeric:tabular-nums}
.tree-item svg{width:14px;height:14px;flex-shrink:0;opacity:.8}
.side .foot{padding:16px;font-size:11px;line-height:1.7;color:var(--shellmuted);border-top:1px solid var(--stroke);margin-top:8px}

.canvas{flex:1;background:radial-gradient(ellipse at 50% 30%,#2A2C31 0%,var(--shell) 70%);display:flex;align-items:center;justify-content:center;overflow:auto;position:relative}
.canvas-inner{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px}
.phone-label{font-size:12px;color:var(--shellmuted)}

/* ===== 手机 ===== */
.phone{width:390px;height:844px;background:#0B0B0B;border-radius:46px;padding:9px;box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 2px #3A3A3A;flex-shrink:0}
.screen{width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column;position:relative}
.statusbar{height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:700;color:var(--ink);position:relative;z-index:5}
.statusbar .right{display:flex;align-items:center;gap:5px}
.capsule{position:absolute;right:12px;top:52px;z-index:8;display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border:1px solid rgba(0,0,0,.08);border-radius:16px;background:rgba(255,255,255,.82);backdrop-filter:blur(6px)}
.capsule i{width:4px;height:4px;border-radius:50%;background:#333;box-shadow:6px 0 0 #333,-6px 0 0 #333;display:block;margin:0 4px}
.capsule .dot{width:15px;height:15px;border:2px solid #333;border-radius:50%;position:relative}
.capsule .dot::after{content:"";position:absolute;inset:3.5px;border:2px solid #333;border-radius:50%}
.navbar{height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 16px;gap:10px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:4}
.navbar .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.navbar .back:hover{background:#F3F0EA}
.navbar .title{font-size:18px;font-weight:700;color:var(--ink);flex:1}
.navbar .nav-act{display:flex;gap:12px;color:var(--ink)}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden}
.scroll::-webkit-scrollbar{width:0}
.tabbar{height:70px;flex-shrink:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:10px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8C867D;font-size:11px;cursor:pointer}
.tab.active{color:var(--red);font-weight:700}
.tab svg{width:23px;height:23px}
/* 模块跳转导航：每页底部常驻 */
.modnav{height:54px;flex-shrink:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:4px;position:relative;z-index:6;margin-top:auto}
.modnav .mi{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8C867D;font-size:10px;cursor:pointer}
.modnav .mi.on{color:var(--red);font-weight:800}
.modnav .mi:active{background:#F7F4EE}

/* ===== 手机内通用组件 ===== */
.hero{background:linear-gradient(135deg,var(--red) 0%,#F3851C 55%,#F5A03A 100%);color:#fff;padding:18px 20px 22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);right:-50px;top:-70px}
.hero::before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;border:1px solid rgba(255,255,255,.16);right:30px;top:40px}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.hero .hi{font-size:23px;font-weight:800;letter-spacing:.5px}
.hero .sub{font-size:12px;opacity:.9;margin-top:6px}
.avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;color:#fff}
.bell-btn{position:relative;cursor:pointer;color:#fff}
.bell-btn .badge{position:absolute;top:-3px;right:-4px;min-width:15px;height:15px;background:var(--gold);color:#7A3E00;border-radius:8px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px;border:1px solid #fff}
.searchbar{margin:14px 16px 0;background:#fff;border-radius:12px;height:46px;display:flex;align-items:center;padding:0 14px;gap:9px;box-shadow:0 4px 16px rgba(120,60,40,.09);position:relative;z-index:3;color:#9C958B;font-size:15px;cursor:pointer}
.sec{margin:20px 16px 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.sec-h .t{font-size:18px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px}
.sec-h .t::before{content:"";width:4px;height:17px;background:var(--red);border-radius:2px}
.sec-h .more{font-size:13px;color:var(--ink2);display:flex;align-items:center;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.notice{margin:14px 16px 0;background:#FFF8E9;border:1px solid #F3DFB8;border-radius:12px;padding:12px 13px;display:flex;align-items:center;gap:10px;font-size:13px;color:#6B4A16;cursor:pointer}
.notice .tag{background:var(--gold);color:#fff;border-radius:5px;padding:3px 7px;font-size:11px;font-weight:700;flex-shrink:0}
.notice .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 2px}
.qitem{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 0;cursor:pointer;border-radius:10px}
.qitem:hover{background:#FAF7F1}
.qitem .ic{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff}
.qitem .lb{font-size:13px;color:var(--ink);font-weight:600}
.svc{display:flex;gap:12px;padding:12px;margin-bottom:10px;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:14px}
.svc .pic{width:90px;height:90px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;overflow:hidden}
.svc .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 60%)}
.svc .info{flex:1;min-width:0;display:flex;flex-direction:column}
.svc .nm{font-size:16px;font-weight:800;color:var(--ink)}
.svc .ds{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.5}
.svc .tags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.tagline{font-size:10px;color:var(--red);background:var(--red-soft);border-radius:4px;padding:2px 5px}
.tagline.g{color:var(--green);background:#E8F5EE}
.svc .bottom{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}
.price{color:var(--red);font-weight:800;font-size:19px}
.price small{font-size:12px;font-weight:500}
.rate{font-size:11px;color:#9A938A}
.btn{background:var(--red);color:#fff;border:none;border-radius:22px;padding:0 18px;height:36px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--red-dark)}
.btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.gray{background:#EDE9E1;color:var(--ink2)}
.btn.big{height:50px;font-size:17px;flex:1;border-radius:25px}
.bottombar{height:72px;flex-shrink:0;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px}
.hint{font-size:11px;color:#9A938A;text-align:center;padding:14px 0 24px}

/* 表单 */
.form-card{margin:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.frow{display:flex;align-items:center;min-height:54px;padding:10px 14px;border-bottom:1px solid var(--line);gap:10px}
.frow:last-child{border-bottom:none}
.frow .lb{font-size:15px;font-weight:700;color:var(--ink);width:76px;flex-shrink:0}
.frow .val{flex:1;font-size:15px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.frow .val.strong{color:var(--ink);font-weight:600}
.frow .edit{color:#9A938A}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px;color:var(--ink2);cursor:pointer;min-height:38px;display:flex;align-items:center}
.chip.active{border-color:var(--red);color:var(--red);background:var(--red-soft);font-weight:700}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{width:22px;height:22px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.stepper b:hover{border-color:var(--red);color:var(--red)}
.stepper span{font-size:16px;font-weight:700;min-width:16px;text-align:center}
textarea{width:100%;border:none;outline:none;resize:none;font-family:inherit;font-size:14px;color:var(--ink2);background:transparent;line-height:1.6}

/* 分类页 */
.cat-wrap{position:absolute;top:94px;bottom:54px;left:0;right:0;display:flex;background:#fff}
.cat-rail{width:96px;background:#F5F2EC;overflow-y:auto;flex-shrink:0}
.cat-rail div{padding:17px 8px;text-align:center;font-size:14px;color:var(--ink2);cursor:pointer;position:relative}
.cat-rail div.active{background:#fff;color:var(--red);font-weight:800}
.cat-rail div.active::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;background:var(--red);border-radius:0 3px 3px 0}
.cat-main{flex:1;overflow-y:auto;padding:14px}
.cat-title{font-size:18px;font-weight:800;margin:4px 0 12px;color:var(--ink)}
.cat-card{display:flex;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer}
.cat-card .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.cat-card .tx{flex:1;min-width:0}
.cat-card .tx b{font-size:15px;color:var(--ink);display:block}
.cat-card .tx span{font-size:12px;color:var(--ink2);display:block;margin-top:4px;line-height:1.4}
.cat-card .tx em{font-style:normal;color:var(--red);font-weight:800;font-size:14px;display:block;margin-top:5px}

/* 详情 */
.hero-detail{height:170px;background:linear-gradient(135deg,#D8620A,#EE7A18);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative}
.hero-detail .big-ic{width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.detail-head{padding:16px;background:#fff;border-bottom:1px solid var(--line)}
.detail-head h2{font-size:21px;color:var(--ink)}
.detail-head .meta{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.detail-head .meta .rate{font-size:12px}
.kv{display:flex;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;gap:10px;background:#fff}
.kv .k{width:74px;color:var(--ink2);flex-shrink:0}
.kv .v{color:var(--ink);flex:1;line-height:1.5}
.steps{display:flex;align-items:center;padding:18px 12px;background:#fff;gap:4px}
.steps .s{flex:1;text-align:center;font-size:11px;color:var(--ink2)}
.steps .s i{display:block;width:26px;height:26px;border-radius:50%;background:var(--red-soft);color:var(--red);font-style:normal;font-weight:800;line-height:26px;margin:0 auto 6px}
.steps .arr{color:#CCC;font-size:12px}
.review{padding:14px 16px;background:#fff}
.review .u{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--ink)}
.review .u .av{width:32px;height:32px;border-radius:50%;background:#F0D9B5;display:flex;align-items:center;justify-content:center;color:#8A5A1E}
.review p{font-size:13px;color:var(--ink2);line-height:1.6;margin-top:9px}
.stars{color:var(--gold);letter-spacing:2px;font-size:13px}

/* 支付 / 成功 */
.pay-hero{background:linear-gradient(160deg,#E9F6EE,#F7F5F0);padding:34px 0 26px;text-align:center;color:var(--green)}
.pay-hero .cc{width:70px;height:70px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto}
.pay-hero h2{font-size:22px;margin-top:12px;color:var(--ink)}
.pay-hero p{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2);background:#fff}
.sum b{color:var(--ink);font-size:15px}
.sum.total b{color:var(--red);font-size:22px}
.pay-method{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}
.pay-method .mi{width:32px;height:32px;border-radius:8px;background:#09BB07;color:#fff;display:flex;align-items:center;justify-content:center}
.pay-method .tx{flex:1;font-size:15px;font-weight:700;color:var(--ink)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #CCC;display:flex;align-items:center;justify-content:center}
.radio.on{border-color:var(--red)}
.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--red)}

/* 订单 */
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);padding:0 6px}
.tabs div{flex:1;text-align:center;padding:13px 0;font-size:14px;color:var(--ink2);cursor:pointer;position:relative}
.tabs div.active{color:var(--red);font-weight:800}
.tabs div.active::after{content:"";position:absolute;bottom:0;left:22%;right:22%;height:3px;background:var(--red);border-radius:2px}
.order{margin:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.order .oh{display:flex;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2)}
.order .oh b{color:var(--green);font-size:13px}
.order .ob{display:flex;gap:11px;padding:13px}
.order .ob .ic{width:52px;height:52px;border-radius:10px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.order .ob b{font-size:15px;color:var(--ink)}
.order .ob p{font-size:12px;color:var(--ink2);margin-top:4px}
.order .of{display:flex;justify-content:flex-end;gap:8px;padding:10px 13px;border-top:1px solid var(--line)}
.mini-btn{height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--ink2);cursor:pointer}
.mini-btn.primary{border-color:var(--red);color:var(--red);font-weight:700}
.timeline{padding:18px 16px;background:#fff}
.tl{display:flex;gap:12px}
.tl .dots{display:flex;flex-direction:column;align-items:center}
.tl .dots i{width:14px;height:14px;border-radius:50%;background:var(--red);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;font-style:normal;flex-shrink:0}
.tl .dots i.off{background:#DDD8CE}
.tl .dots .line{width:2px;flex:1;background:#E8E2D8;min-height:26px}
.tl .txt{padding-bottom:18px}
.tl .txt b{font-size:14px;color:var(--ink)}
.tl .txt span{font-size:12px;color:var(--ink2);margin-left:8px}
.tl .txt p{font-size:12px;color:#9A938A;margin-top:4px}

/* 健康 / 活动 / 消息 / 我的 */
.health-hero{margin:14px;background:linear-gradient(135deg,#1F7A5C,#38A376);border-radius:16px;padding:18px;color:#fff}
.health-hero .t{font-size:13px;opacity:.9}
.health-hero .v{font-size:28px;font-weight:800;margin-top:5px}
.health-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px}
.hcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}
.hcard .l{font-size:12px;color:var(--ink2)}
.hcard .n{font-size:23px;font-weight:800;color:var(--ink);margin-top:5px}
.hcard .n small{font-size:12px;color:var(--ink2);font-weight:500}
.hcard .st{font-size:11px;color:var(--green);margin-top:5px}
.bar{height:6px;background:#EEEAE2;border-radius:3px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.act{margin:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.act .cover{height:96px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:800;letter-spacing:2px}
.act .ab{padding:12px 13px}
.act .ab b{font-size:16px;color:var(--ink)}
.act .ab p{font-size:12px;color:var(--ink2);margin-top:6px;display:flex;gap:12px}
.msg{display:flex;gap:11px;padding:14px;background:#fff;border-bottom:1px solid var(--line);cursor:pointer}
.msg .mi{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.msg .tx{flex:1;min-width:0}
.msg .tx b{font-size:15px;color:var(--ink)}
.msg .tx p{font-size:12px;color:var(--ink2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .tx time{font-size:11px;color:#A9A299;float:right}
/* AI 客服 */
.ai-wrap{flex:1 1 auto;min-height:0;overflow-y:auto;background:var(--paper);padding:14px}
.ai-wrap::-webkit-scrollbar{width:0}
.ai-intro{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.ai-avatar{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--red),#F5A03A);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-intro b{font-size:15px;color:var(--ink)}
.ai-intro p{font-size:11px;color:var(--ink2);margin-top:3px}
.ai-online{margin-left:auto;font-size:11px;color:var(--green);background:#E8F5EE;border-radius:10px;padding:3px 8px}
.ai-tip{margin:12px 2px 0;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;border-top-left-radius:3px;font-size:13px;color:var(--ink2);line-height:1.65}
.ai-label{font-size:13px;font-weight:800;color:var(--ink);margin:18px 2px 10px}
.ai-qa{display:flex;flex-direction:column;gap:8px}
.ai-qbtn{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14px;color:var(--ink);cursor:pointer}
.ai-qbtn:hover{border-color:var(--red);color:var(--red)}
.ai-qbtn svg{color:var(--red)}
.ai-log{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:86%;padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.65}
.ai-msg.q{align-self:flex-end;background:var(--red);color:#fff;border-top-right-radius:3px}
.ai-msg.a{align-self:flex-start;background:#fff;color:var(--ink2);border:1px solid var(--line);border-top-left-radius:3px}
.ai-inputbar{height:58px;flex-shrink:0;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px}
.ai-inputbar input{flex:1;height:40px;border:1px solid var(--line);border-radius:20px;background:var(--paper);padding:0 14px;font-size:14px;outline:none;color:var(--ink)}
.ai-voice{width:36px;height:36px;border-radius:50%;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.ai-banner{display:flex;align-items:center;gap:11px;background:linear-gradient(120deg,#FFF3E4,#FFE9D2);border:1px solid #F5DFC4;border-radius:13px;padding:12px 13px;cursor:pointer}
.ai-banner-ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--red),#F5A03A);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-banner b{display:block;font-size:15px;color:var(--ink)}
.ai-banner span{display:block;font-size:12px;color:var(--ink2);margin-top:3px}
.ai-banner>svg{color:var(--red)}
.profile-head{background:linear-gradient(135deg,var(--red),#E87D29);padding:26px 18px 22px;color:#fff;display:flex;align-items:center;gap:14px;flex-shrink:0}
.profile-head .av{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center}
.profile-head b{font-size:21px}
.profile-head p{font-size:12px;opacity:.9;margin-top:6px}
.vip{margin:14px 14px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex}
.vip>div{flex:1;text-align:center;border-right:1px solid var(--line)}
.vip>div:last-child{border-right:none}
.vip b{font-size:19px;color:var(--ink);display:block}
.vip span{font-size:11px;color:var(--ink2)}
.plist{margin:14px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prow{display:flex;align-items:center;gap:11px;padding:14px;border-bottom:1px solid var(--line);font-size:15px;color:var(--ink);cursor:pointer}
.prow:last-child{border-bottom:none}
.prow .mi{width:30px;height:30px;border-radius:9px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.prow .tx{flex:1}
.prow .ex{font-size:12px;color:#9A938A}

/* ===== 右侧标注 ===== */
.inspect{width:280px;background:var(--panel);border-left:1px solid var(--stroke);overflow-y:auto;flex-shrink:0}
.inspect .hd{padding:17px 16px;border-bottom:1px solid var(--stroke)}
.inspect .hd h2{font-size:15px;font-weight:700}
.inspect .hd p{font-size:11px;color:var(--shellmuted);margin-top:5px;line-height:1.6}
.inspect .blk{padding:16px;border-bottom:1px solid var(--stroke)}
.inspect h4{font-size:11px;letter-spacing:1.2px;color:var(--shellmuted);margin-bottom:11px;font-weight:600}
.inspect .desc{font-size:12px;line-height:1.85;color:#C4C7CB}
.inspect ul{list-style:none}
.inspect li{font-size:12px;color:#C4C7CB;line-height:1.7;padding:7px 0 7px 16px;position:relative;border-bottom:1px dashed #383C41}
.inspect li:last-child{border-bottom:none}
.inspect li::before{content:"";position:absolute;left:2px;top:14px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.inspect .badge{display:inline-block;background:#3A3E44;color:#D8DBDE;font-size:10px;padding:3px 7px;border-radius:4px;margin:0 5px 5px 0}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.path .badge{background:var(--red);color:#fff}

/* 预览模式隐藏侧栏 */
body.preview .side,body.preview .inspect{display:none}
body.preview .topbar .crumb{display:none}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

let current='launch', scale=1;
const tree=document.getElementById('tree'), screen=document.getElementById('screen'), inspect=document.getElementById('inspect'), crumb=document.getElementById('crumb');
const groups={};
Object.keys(PAGES).forEach(k=>{(groups[PAGES[k].group]||(groups[PAGES[k].group]=[])).push(k)});
tree.innerHTML=Object.entries(groups).map(([g,keys])=>`<h3>${g}</h3><div class="tree-group">${keys.map((k,i)=>`<div class="tree-item" data-page="${k}"><span class="idx">${String(i+1).padStart(2,'0')}</span>${I(PAGES[k].ic,14)}<span>${PAGES[k].title}</span></div>`).join('')}</div>`).join('');

function renderCat(idx){
 document.querySelectorAll('#catRail div').forEach(d=>d.classList.toggle('active',+d.dataset.cat===idx));
 const c=CATS[idx];
 document.getElementById('catMain').innerHTML=`<div class="cat-title">${c.title}</div>${c.items.map(it=>`<div class="cat-card" data-go="service-detail"><div class="ic" style="background:${it[4]}">${I(it[3],22)}</div><div class="tx"><b>${it[0]}</b><span>${it[1]}</span><em>${it[2]}</em></div>${I('right',15)}</div>`).join('')}`;
 document.querySelectorAll('#catMain [data-go]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();go(el.dataset.go)}));
}

function bind(){
 screen.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();go(el.dataset.go)}));
 screen.querySelectorAll('[data-cat]').forEach(el=>el.addEventListener('click',()=>renderCat(+el.dataset.cat)));
 screen.querySelectorAll('.chip').forEach(el=>el.addEventListener('click',()=>{
  const p=el.parentElement; p.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); el.classList.add('active');
 }));
 screen.querySelectorAll('.tabs div').forEach(el=>el.addEventListener('click',()=>{
  el.parentElement.querySelectorAll('div').forEach(x=>x.classList.remove('active')); el.classList.add('active');
 }));
 screen.querySelectorAll('[data-pay]').forEach(el=>el.addEventListener('click',()=>{
  screen.querySelectorAll('[data-pay]').forEach(x=>{x.querySelector('.radio').classList.remove('on')}); el.querySelector('.radio').classList.add('on');
 }));
 const minus=screen.querySelector('#minus'), plus=screen.querySelector('#plus');
 if(minus){
  const upd=()=>{const n=+screen.querySelector('#qty').textContent;screen.querySelector('#total').textContent=n*25};
  minus.onclick=()=>{const q=screen.querySelector('#qty');if(+q.textContent>1){q.textContent=+q.textContent-1;upd()}};
  plus.onclick=()=>{const q=screen.querySelector('#qty');q.textContent=+q.textContent+1;upd()};
 }
 // AI 客服问答
 const aiLog=screen.querySelector('#aiLog');
 if(aiLog){
  const ask=(q)=>{
   if(!q.trim())return;
   aiLog.insertAdjacentHTML('beforeend',`<div class="ai-msg q">${q}</div>`);
   setTimeout(()=>{
    aiLog.insertAdjacentHTML('beforeend',`<div class="ai-msg a">${aiAnswer(q)}</div>`);
    aiLog.parentElement.scrollTop=aiLog.parentElement.scrollHeight;
   },350);
   aiLog.parentElement.scrollTop=aiLog.parentElement.scrollHeight;
  };
  screen.querySelectorAll('[data-q]').forEach(el=>el.addEventListener('click',()=>ask(el.dataset.q)));
  const input=screen.querySelector('#aiInput'), send=screen.querySelector('#aiSend');
  send.onclick=()=>{ask(input.value);input.value=''};
  input.onkeydown=e=>{if(e.key==='Enter'){ask(input.value);input.value=''}};
 }
}

function go(id){
 if(!PAGES[id])return;
 current=id;
 const p=PAGES[id];
 screen.innerHTML=p.html+modnav(PAGE_MODULE[id]||'');
 document.querySelectorAll('.tree-item').forEach(el=>el.classList.toggle('active',el.dataset.page===id));
 crumb.innerHTML=`原型 / <b>${p.group}</b> / ${p.title}`;
 inspect.innerHTML=`<div class="hd"><h2>${p.title}</h2><p>${p.group} · ${Object.keys(PAGES).indexOf(id)+1} / ${Object.keys(PAGES).length}</p></div>
 <div class="blk"><h4>页面说明</h4><div class="desc">${p.desc}</div></div>
 <div class="blk"><h4>交互与跳转</h4><div class="path">${p.flow.map(f=>`<span class="badge">${PAGES[f].title}</span>`).join('')}</div></div>
 <div class="blk"><h4>设计要点 / 适老化</h4><ul>${p.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>
 <div class="blk"><h4>按钮 / 功能 / 逻辑细节</h4><ul>${(PAGE_DETAIL[id]||[]).map(n=>`<li>${n}</li>`).join('')}</ul></div>
 <div class="blk"><h4>实现标注</h4><span class="badge">可点击跳转</span><span class="badge">固定 Tab 栏</span><span class="badge">大字模式</span><span class="badge">高对比配色</span></div>`;
 bind();
 if(id==='category')renderCat(0);
 screen.parentElement.parentElement.scrollTop=0;
 document.querySelector('.scroll')?.scrollTo(0,0);
}

tree.addEventListener('click',e=>{const it=e.target.closest('.tree-item');if(it)go(it.dataset.page)});
document.getElementById('zoomIn').onclick=()=>{scale=Math.min(1.3,scale+.1);document.querySelector('.canvas-inner').style.transform=`scale(${scale})`};
document.getElementById('zoomOut').onclick=()=>{scale=Math.max(.6,scale-.1);document.querySelector('.canvas-inner').style.transform=`scale(${scale})`};
document.getElementById('zoomVal').textContent='100%';
const setZoom=()=>document.getElementById('zoomVal').textContent=Math.round(scale*100)+'%';
document.getElementById('zoomIn').onclick=()=>{scale=Math.min(1.3,scale+.1);document.querySelector('.canvas-inner').style.transform=`scale(${scale})`;setZoom()};
document.getElementById('zoomOut').onclick=()=>{scale=Math.max(.6,scale-.1);document.querySelector('.canvas-inner').style.transform=`scale(${scale})`;setZoom()};
document.getElementById('resetBtn').onclick=()=>{scale=1;document.querySelector('.canvas-inner').style.transform='scale(1)';setZoom();go('launch')};
document.getElementById('previewBtn').onclick=e=>{document.body.classList.toggle('preview');e.target.classList.toggle('on');e.target.textContent=document.body.classList.contains('preview')?'退出预览':'预览模式'};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('preview'))document.getElementById('previewBtn').click()});
go('launch');
</script>
</body>
